<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01-Forum</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div id="myModal" class="modal" style="display: none;">
        <div class="modal-content">
            <form class="formLogins" method="POST" action="/post" enctype="multipart/form-data">
                <span class="close" onclick="closeModal()">&times;</span>
                <label class="form-label" for="photo">Image:</label>
                <input class="form-input" type="file" id="photo" name="photo" accept="image/*">

                <label class="form-label" for="title">Title:</label>
                <input class="form-input" type="text" id="title" name="title" required>

                <label class="form-label" for="categories">Categorizes:</label>
                <input class="form-input" type="text" id="categories" name="categories" required>

                <label class="form-label" for="content">Content:</label>
                <textarea class="form-input" id="content" name="content" rows="6" required></textarea>

                <button class="form-button" type="submit">Post</button>
            </form>
        </div>
    </div>
    <div id="message-popup">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <p>Vous avez un nouveau message de <strong id="user">@Utilisateur</strong></p>
    </div>
    <div class="container-flex" id="container-flex"></div>

    <script>
        function newPost1() {
            console.log('li');
        }
        var all = {{.}}
    </script>
    <script src="./js/script.js"></script>
    <style>
        .post {
            height: auto;
            background-color: #f09819;
        }

        .background {
            width: 430px;
            height: 520px;
            position: absolute;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
        }

        .background .shape {
            height: 200px;
            width: 200px;
            position: absolute;
            border-radius: 50%;
        }

        .shape:first-child {
            background: linear-gradient(#D9DCF2,
                    #ECEEF2);
            left: -80px;
            top: -80px;
        }

        .shape:last-child {
            background: linear-gradient(to right,
                    #3746b6,
                    #bdbbbb);
            right: -30px;
            bottom: -80px;
        }

        .formLogin {
            height: fit-content;
            width: 400px;
            background-color: rgba(208, 209, 216, 0.795);
            position: absolute;
            transform: translate(-50%, -50%);
            top: 50%;
            left: 50%;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
            padding: 50px 35px;
        }

        .formLogin select {
            background-color: #BFBFBF;
        }

        .formLogin * {
            font-family: 'Poppins', sans-serif;
            color: #fafafa;
            letter-spacing: 0.5px;
            outline: none;
            border: none;
            font-weight: bolder;
        }

        .formLogin h3 {
            font-size: 32px;
            font-weight: bolder;
            line-height: 42px;
            text-align: center;
            color: #080710;
        }

        .formLogin label {
            display: block;
            margin-top: 30px;
            font-size: 16px;
            font-weight: bolder;
            color: #000000;

        }

        .formLogin input {
            display: block;
            height: 50px;
            width: 100%;
            background-color: #BFBFBF;
            border-radius: 3px;
            margin-top: 8px;
            font-size: 18px;
            color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .formLogin ::placeholder {
            color: #424040;
        }

        .formLogin .registerForm {
            margin-top: 50px;
            width: 100%;
            background-color: #BFBFBF;
            color: #080710;
            padding: 15px 0;
            font-size: 18px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
        }

        .social {
            margin-top: 30px;
            display: flex;
        }

        .social div {
            background: red;
            width: 150px;
            border-radius: 3px;
            padding: 5px 10px 10px 5px;
            background-color: rgba(255, 255, 255, 0.27);
            color: #eaf0fb;
            text-align: center;
        }

        .social div:hover {
            background-color: rgba(255, 255, 255, 0.47);
        }

        .social .fb {
            margin-left: 25px;
        }

        .social i {
            margin-right: 4px;
        }
    </style>
</body>

</html>
